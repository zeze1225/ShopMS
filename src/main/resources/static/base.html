<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>基础数据管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="module-container">

<!-- ====== 分类管理 ====== -->
<h3>商品分类</h3>
<div class="toolbar">
    <div class="search-box">
        <input type="text" id="searchKeyword" placeholder="搜索分类名称">
        <button class="btn btn-info btn-sm" onclick="searchCate()">搜索</button>
        <button class="btn btn-sm" onclick="loadCategory()" style="background:#ccc;">全部</button>
    </div>
    <div class="btn-group">
        <button class="btn btn-success btn-sm" onclick="showCateAdd()">添加分类</button>
        <button class="btn btn-danger btn-sm" onclick="batchDelCate()">批量删除</button>
    </div>
</div>
<table class="data-table">
    <thead><tr><th width="40"><input type="checkbox" id="checkAll1" onclick="toggleAll('.cate-check','#checkAll1')"></th><th width="60">编号</th><th>分类名称</th><th width="160">操作</th></tr></thead>
    <tbody id="cateBody"><tr class="empty-row"><td colspan="4">加载中...</td></tr></tbody>
</table>

<!-- ====== 品牌管理 ====== -->
<h3 style="margin-top:25px;">品牌管理</h3>
<table class="data-table">
    <thead><tr><th width="60">编号</th><th>品牌名称</th></tr></thead>
    <tbody id="brandBody"><tr class="empty-row"><td colspan="2">加载中...</td></tr></tbody>
</table>

</div>

<!-- 分类弹窗 -->
<div class="modal-overlay" id="cateModal">
    <div class="modal-dialog">
        <div class="modal-header"><h4 id="cateModalTitle">添加分类</h4><button class="close-btn" onclick="closeCateModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="cateEditId"><div class="form-group"><label>分类名称：</label><input type="text" id="cateEditName"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-sm" onclick="closeCateModal()">取消</button><button class="btn btn-primary btn-sm" onclick="saveCate()">保存</button></div>
    </div>
</div>

<script src="js/jquery-3.7.1.min.js"></script>
<script>
$(function(){loadCategory();loadBrand();});

// ====== 分类 ======
function loadCategory(){$("#searchKeyword").val("");$.ajax({url:"/category/list",type:"GET",success:function(res){if(res.code==-1){window.parent.location.href="/login.html";return;}renderCate(res.data);}});}
function searchCate(){var g=$("#searchKeyword").val();$.ajax({url:"/category/list",type:"GET",data:{keyword:g},success:function(res){if(res.code==-1){window.parent.location.href="/login.html";return;}renderCate(res.data);}});}
function renderCate(list){var h="";if(list&&list.length>0){for(var i=0;i<list.length;i++){var item=list[i];h+="<tr>";h+='<td><input type="checkbox" value="'+item.id+'" class="cate-check"></td>';h+="<td>"+item.id+"</td><td>"+item.name+"</td>";h+='<td><button class="btn btn-warning btn-sm" onclick="showCateEdit('+item.id+')">修改</button>&nbsp;';h+='<button class="btn btn-danger btn-sm" onclick="delCate('+item.id+')">删除</button></td></tr>';}}else{h='<tr class="empty-row"><td colspan="4">暂无分类</td></tr>';}$("#cateBody").html(h);}
function showCateAdd(){$("#cateModalTitle").text("添加分类");$("#cateEditId").val("");$("#cateEditName").val("");$("#cateModal").addClass("show");}
function showCateEdit(id){$.ajax({url:"/category/get",type:"GET",data:{id:id},success:function(res){if(res.code==0){$("#cateModalTitle").text("修改分类");$("#cateEditId").val(res.data.id);$("#cateEditName").val(res.data.name);$("#cateModal").addClass("show");}}});}
function closeCateModal(){$("#cateModal").removeClass("show");}
function saveCate(){var id=$("#cateEditId").val();var m=$("#cateEditName").val();if(m==""){alert("请输入分类名称");return;}var url=id?"/category/update":"/category/add";$.ajax({url:url,type:"POST",data:{id:id,name:m},success:function(res){if(res.code==0){alert(res.msg);closeCateModal();loadCategory();}else{alert(res.msg);}}});}
function delCate(id){if(!confirm("确定删除？"))return;$.ajax({url:"/category/delete",type:"POST",data:{id:id},success:function(res){alert(res.msg);if(res.code==0)loadCategory();}});}
function batchDelCate(){var ids=[];$(".cate-check:checked").each(function(){ids.push($(this).val());});if(ids.length==0){alert("请勾选记录");return;}if(!confirm("确定删除"+ids.length+"条？"))return;$.ajax({url:"/category/deleteBatch",type:"POST",traditional:true,data:{ids:ids},success:function(res){alert(res.msg);if(res.code==0)loadCategory();}});}
function toggleAll(cls,checkId){var c=$(checkId).prop("checked");$(cls).prop("checked",c);}

// ====== 品牌（只读展示） ======
function loadBrand(){$.ajax({url:"/brand/list",type:"GET",success:function(res){if(res.code==-1){window.parent.location.href="/login.html";return;}var list=res.data;var h="";if(list&&list.length>0){for(var i=0;i<list.length;i++){h+="<tr><td>"+list[i].id+"</td><td>"+list[i].name+"</td></tr>";}}else{h='<tr class="empty-row"><td colspan="2">暂无品牌</td></tr>';}$("#brandBody").html(h);}});}
</script>
</body>
</html>
