<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商品分类管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="module-container">
        <h3>商品分类管理（新增模块）</h3>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchKeyword" placeholder="输入分类名称搜索">
                <button class="btn btn-info btn-sm" onclick="searchData()">搜 索</button>
                <button class="btn btn-sm" onclick="loadData()" style="background:#ccc;">显示全部</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-success btn-sm" onclick="showAddModal()">添加分类</button>
                <button class="btn btn-danger btn-sm" onclick="batchDelete()">批量删除</button>
            </div>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th width="40"><input type="checkbox" id="checkAll" onclick="toggleCheckAll()"></th>
                    <th width="60">编号</th>
                    <th>分类名称</th>
                    <th width="160">操作</th>
                </tr>
            </thead>
            <tbody id="dataBody">
                <tr class="empty-row"><td colspan="4">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h4 id="modalTitle">添加分类</h4>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>分类名称：</label>
                    <input type="text" id="editName" placeholder="请输入分类名称">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-sm" onclick="closeModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(function() {
            // debugger; // 调试时取消注释
            loadData();
        });

        function loadData() {
            $("#searchKeyword").val("");
            // console.log("加载分类列表...");
            $.ajax({
                url: "/category/list",
                type: "GET",
                success: function(res) {
                    if (res.code == -1) {
                        window.parent.location.href = "/login.html";
                        return;
                    }
                    renderTable(res.data);
                },
                error: function() {
                    alert("加载数据失败");
                }
            });
        }

        function searchData() {
            var guanjianci = $("#searchKeyword").val();
            // console.log("搜索：" + guanjianci);
            $.ajax({
                url: "/category/list",
                type: "GET",
                data: { keyword: guanjianci },
                success: function(res) {
                    if (res.code == -1) {
                        window.parent.location.href = "/login.html";
                        return;
                    }
                    renderTable(res.data);
                }
            });
        }

        function renderTable(list) {
            var biaoHtml = "";
            var len = 0; // 后面可能用来看有多少条
            if (list && list.length > 0) {
                len = list.length;
                for (var i = 0; i < list.length; i++) {
                    var item = list[i];
                    biaoHtml += '<tr>';
                    biaoHtml += '<td><input type="checkbox" value="' + item.id + '" class="checkItem"></td>';
                    biaoHtml += '<td>' + item.id + '</td>';
                    biaoHtml += '<td>' + item.name + '</td>';
                    biaoHtml += '<td>';
                    biaoHtml += '<button class="btn btn-warning btn-sm" onclick="showEditModal(' + item.id + ')">修改</button>&nbsp;';
                    biaoHtml += '<button class="btn btn-danger btn-sm" onclick="deleteOne(' + item.id + ')">删除</button>';
                    biaoHtml += '</td>';
                    biaoHtml += '</tr>';
                }
            } else {
                biaoHtml = '<tr class="empty-row"><td colspan="4">暂无数据</td></tr>';
            }
            // debugger;
            $("#dataBody").html(biaoHtml);
        }

        // 之前叫showModal，后来改名为showAddModal
        function showAddModal() {
            $("#modalTitle").text("添加分类");
            $("#editId").val("");
            $("#editName").val("");
            $("#editModal").addClass("show");
        }

        function showEditModal(id) {
            $.ajax({
                url: "/category/get",
                type: "GET",
                data: { id: id },
                success: function(res) {
                    if (res.code == 0) {
                        $("#modalTitle").text("修改分类");
                        $("#editId").val(res.data.id);
                        $("#editName").val(res.data.name);
                        $("#editModal").addClass("show");
                    } else {
                        alert(res.msg);
                    }
                }
            });
        }

        function closeModal() {
            $("#editModal").removeClass("show");
        }

        function toggleCheckAll() {
            var checked = $("#checkAll").prop("checked");
            $(".checkItem").prop("checked", checked);
        }

        function saveData() {
            var id = $("#editId").val();
            var mingcheng = $("#editName").val();
            if (mingcheng == "") {
                alert("请输入分类名称！");
                return;
            }
            var url = id ? "/category/update" : "/category/add";
            $.ajax({
                url: url,
                type: "POST",
                data: { id: id, name: mingcheng },
                success: function(res) {
                    if (res.code == 0) {
                        alert(res.msg);
                        closeModal();
                        loadData();
                    } else {
                        alert(res.msg);
                    }
                },
                error: function() {
                    alert("操作失败");
                }
            });
        }

        function deleteOne(id) {
            if (!confirm("确定要删除这条分类吗？")) return;
            // console.log("开始删除分类，id=" + id);
            $.ajax({
                url: "/category/delete",
                type: "POST",
                data: { id: id },
                success: function(res) {
                    alert(res.msg);
                    if (res.code == 0) loadData();
                }
            });
        }

        function batchDelete() {
            var ids = [];
            // debugger;
            $(".checkItem:checked").each(function() {
                ids.push($(this).val());
            });
            if (ids.length == 0) {
                alert("请先勾选要删除的记录");
                return;
            }
            if (!confirm("确定要删除选中的" + ids.length + "条记录吗？")) return;
            $.ajax({
                url: "/category/deleteBatch",
                type: "POST",
                traditional: true,
                data: { ids: ids },
                success: function(res) {
                    alert(res.msg);
                    if (res.code == 0) loadData();
                }
            });
        }
    </script>
</body>
</html>
